name: Unit plurals copy check

# src/data/json/unit_plurals.json is a verbatim copy of the file hed-specification publishes
# (its docs/source/_static/unit_plurals.json, served at
# https://www.hedtags.org/hed-specification/_static/unit_plurals.json). The file has one home, so
# this check fails when the copy drifts from hed-specification main. It runs when the copy or this
# workflow changes and weekly, not on every pull request, so an unrelated change cannot start
# failing because the specification moved.

on:
  workflow_dispatch:
  push:
    paths:
      - src/data/json/unit_plurals.json
      - .github/workflows/unit_plurals.yml
  pull_request:
    paths:
      - src/data/json/unit_plurals.json
      - .github/workflows/unit_plurals.yml
  schedule:
    # Weekly on Sundays at 5:00 AM UTC, after the character sets check
    - cron: '0 5 * * 0'

permissions:
  contents: read

jobs:
  copy-check:
    name: Copy matches hed-specification main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare with hed-specification main
        run: |
          curl -fsSL -o /tmp/unit_plurals.json \
            https://raw.githubusercontent.com/hed-standard/hed-specification/main/docs/source/_static/unit_plurals.json
          cmp /tmp/unit_plurals.json src/data/json/unit_plurals.json
